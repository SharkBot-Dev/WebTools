<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>文字数カウント</title>

        <style>
            body {
                padding: 0px;
                margin: 0px;
                background-color: #f8fafc;
                font-family: sans-serif;
            }

            .box {
                border-radius: 20px;
                background-color: rgb(202, 202, 202);
                padding: 20px;
            }

            .box textarea {
                width: 100%;
                height: 100px;
            }

            .top {
                padding: 20px;
                margin: 20px;
            }

            .top h3 {
                margin-bottom: 12px;
                color: #333;
            }
        </style>
    </head>

    <body>
        <div id="header"></div>

        <div class="top">
            <h1>文字数カウント</h1>

            <a href="/">戻る</a><br><br>

            <div class="box">
                <textarea id="textinput" placeholder="ここに文字を入力するとカウントされます"></textarea>

                <p id="count">文字数: 0</p>
            </div>
        </div>
    </body>

    <script src="/header.js"></script>

    <script>
        const countDisplay = document.getElementById("count");

        document.getElementById("textinput").addEventListener('input', (event) => {
            countDisplay.innerHTML = `文字数: ${event.target.value.length}`
        });
    </script>
</html>
