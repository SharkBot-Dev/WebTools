<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>絵文字から画像URLに</title>

        <style>
            body {
                padding: 0px;
                margin: 0px;
                background-color: #f8fafc;
                font-family: sans-serif;
            }

            .box {
                border-radius: 20px;
                background-color: rgb(202, 202, 202);
                padding: 20px;
            }

            .box textarea {
                width: 100%;
                height: 100px;
                box-sizing: border-box;
            }

            .top {
                padding: 20px;
                margin: 20px;
            }

            .top h3 {
                margin-bottom: 12px;
                color: #333;
            }

            #emojiImageInner {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 15px;
            }

            #emojiImageInner img {
                width: 48px;
                height: 48px;
                object-fit: contain;
            }
        </style>
    </head>

    <body>
        <div id="header"></div>

        <div class="top">
            <h1>絵文字から画像URLに</h1>

            <a href="/">戻る</a><br><br>

            <div class="box">
                <textarea id="emoji" placeholder="Discord絵文字を入力してください。"></textarea><br>

                <div id="emojiImageInner"></div>
            </div>
        </div>
    </body>

    <script src="/header.js"></script>

    <script>
        const EMOJI_RE = /<a?:(\w+):(\d+?)>/g;

        function extractDiscordEmojiInfo(text) {
            const matches = text.matchAll(EMOJI_RE);
            const results = [];

            for (const match of matches) {
                const fullEmoji = match[0];
                const name = match[1];
                const emojiId = match[2];
                const isAnimated = fullEmoji.startsWith("<a:");

                results.push({ name, emojiId, isAnimated });
            }

            return results;
        }

        document.getElementById("emoji").addEventListener('input', (event) => {
            const emojis = extractDiscordEmojiInfo(event.target.value);
            const emojiImage = document.getElementById("emojiImageInner");
            
            emojiImage.innerHTML = "";

            emojis.forEach((emoji) => {
                const img = document.createElement("img");
                const ext = emoji.isAnimated ? "gif" : "png";
                
                img.src = `https://cdn.discordapp.com/emojis/${emoji.emojiId}.${ext}`;
                img.alt = emoji.name;
                img.title = `:${emoji.name}:`;
                
                emojiImage.appendChild(img);
            });
        });
    </script>
</html>
